name: Build Now

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        run: |
          flutter create --platforms=android,windows --org com.now --project-name now_app .
          rm -rf test
          python3 ci/patch_android.py
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: Now-Android-APK
          path: build/app/outputs/flutter-apk/*-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        shell: bash
        run: |
          flutter create --platforms=android,windows --org com.now --project-name now_app .
          rm -rf test
          python ci/patch_windows.py
          # اعلان سیستم فقط برای اندروید است؛ افزونه‌اش را از ساخت ویندوز حذف می‌کنیم
          cp ci/notifier_stub.dart.txt lib/notifier.dart
          flutter pub remove flutter_local_notifications timezone
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Build installer (Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $src = (Get-ChildItem -Path build\windows -Recurse -Filter Now.exe | Select-Object -First 1).DirectoryName
          $ico = (Resolve-Path windows\runner\resources\app_icon.ico).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DSourceDir=$src" "/DIconFile=$ico" ci\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Now-Windows-Setup
          path: installer_out/*.exe
