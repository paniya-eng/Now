name: Build Now

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        run: |
          flutter create --platforms=android,windows --org com.now --project-name now_app .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="الآن"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import os
          for f in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if os.path.exists(f):
                  s = open(f, encoding='utf-8').read()
                  if f.endswith('.kts'):
                      block = "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
                  else:
                      block = "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
                  s = s.replace("android {\n", block, 1)
                  open(f, 'w', encoding='utf-8').write(s)
                  print('patched', f)
          PY
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: Now-Android-APK
          path: build/app/outputs/flutter-apk/*-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        shell: bash
        run: |
          flutter create --platforms=android,windows --org com.now --project-name now_app .
          rm -rf test
          sed -i 's/L"now_app"/L"Now"/' windows/runner/main.cpp
          sed -i 's/size(1280, *720)/size(360, 780)/' windows/runner/main.cpp
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          $dir = (Get-ChildItem -Path build\windows -Recurse -Filter now_app.exe | Select-Object -First 1).DirectoryName
          Compress-Archive -Path "$dir\*" -DestinationPath Now-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Now-Windows
          path: Now-Windows.zip
