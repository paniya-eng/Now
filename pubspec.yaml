name: now_app
description: "الآن / Now - Iranian calendar, clock and reminders"
publish_to: "none"
version: 0.5.0+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  share_plus: ^10.1.4
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  window_manager: ">=0.4.0 <1.0.0"
  tray_manager: ">=0.2.4 <1.0.0"
  launch_at_startup: ">=0.3.0 <1.0.0"

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_small.png
    - assets/sounds/
    - assets/icon/tray.ico
  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/app-regular.ttf
        - asset: assets/fonts/app-bold.ttf
          weight: 700
